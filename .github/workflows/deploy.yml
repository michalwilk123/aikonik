name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hubmi-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - name: Pure tests (no AI credentials)
        run: bun run test:pure
      - name: D1 integration tests (no AI credentials)
        run: bun run test:integration
      - run: bunx playwright install --with-deps chromium
      - name: Chat browser tests (fixture responses)
        run: bun run test:e2e
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run knip
      - run: bun run build:cloudflare
      - run: bunx wrangler d1 migrations apply hubmi --remote
      - run: bunx opennextjs-cloudflare deploy
